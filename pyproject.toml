[project]
name = "sales-gpt-agent"
version = "0.5.0"
description = "AI SDR and Account Executive copilot for B2B sales"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "streamlit>=1.36.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
sales-gpt = "sales_gpt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_gpt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]